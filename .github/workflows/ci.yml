name: Check plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code -- host.mjs client.js entry.mjs
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-project-board-node-${{ matrix.node }}
          path: '*.tgz'
