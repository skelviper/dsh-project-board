name: Check plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code -- host.mjs client.js entry.mjs
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-project-board-node-${{ matrix.node }}
          path: '*.tgz'

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package and publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${PLUGIN_VERSION}"
          npm pack
          git archive --format=zip --prefix=dsh-project-board/ --output="dsh-project-board-${PLUGIN_VERSION}-source.zip" HEAD
          sha256sum "dsh-project-board-${PLUGIN_VERSION}.tgz" "dsh-project-board-${PLUGIN_VERSION}-source.zip" > "dsh-project-board-${PLUGIN_VERSION}-SHA256SUMS.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          version = os.environ['GITHUB_REF_NAME'][1:]
          section = Path('CHANGELOG.md').read_text().split('## ' + version + '\n', 1)[1].split('\n## ', 1)[0].strip()
          install = '```sh\ndsh plugin --profile web add github:skelviper/dsh-project-board#v' + version + '\n```'
          Path('RELEASE_NOTES.md').write_text(section + '\n\n## Install\n\nRequires DSH 0.2.1-rc.2 Web and the official Agent Team bundle.\n\n' + install + '\n\nSee the README for requirements and migration instructions.\n')
          PY
          gh release create "$GITHUB_REF_NAME" "dsh-project-board-${PLUGIN_VERSION}.tgz" "dsh-project-board-${PLUGIN_VERSION}-source.zip" "dsh-project-board-${PLUGIN_VERSION}-SHA256SUMS.txt" --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
